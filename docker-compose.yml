# Stack projet A : Qdrant (vector store) + API RAG.
# Demarrage : docker compose up -d
# ROLE : R4 (DevOps / Observabilite).

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # API REST/HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - .:/app                                  # code + corpus montes en direct
      - hf_cache:/root/.cache/huggingface       # cache modele (evite de re-telecharger)
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
  hf_cache:
