services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: assistkb_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "timeout 3 bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: assistkb_api
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
  hf_cache: