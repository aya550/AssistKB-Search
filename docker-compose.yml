# Stack projet A : Qdrant (vector store) + API RAG.
# Demarrage : docker compose up -d
# ROLE : R4 (DevOps / Observabilite).

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # API REST/HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    # TODO (R4) : ajouter un healthcheck propre et passer l'api en
    # depends_on: { qdrant: { condition: service_healthy } }.

  api:
    build: .
    env_file: .env
    environment:
      # Dans le reseau compose, Qdrant est joignable par son nom de service.
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - .:/app                                  # code + corpus montes en direct
      - hf_cache:/root/.cache/huggingface       # cache modele (evite de re-telecharger)
    depends_on:
      - qdrant

volumes:
  qdrant_data:
  hf_cache:
